# Face Sorter configuration. Values here override the built-in defaults and are
# themselves overridden by command-line flags (--confidence, --threshold).
# The file ./config.ini is used automatically if present; pass --config to use another.
#
# Thresholds are cosine distances between face embeddings: 0 = identical direction,
# 1 = unrelated, 2 = opposite. Lower values are stricter.

[DEFAULT]
# Minimum face detection score (0.0 - 1.0). Faces scoring lower are ignored.
confidence = 0.8

# `sort`: two faces are joined into the same group when their distance is <= this value
# (0.0 - 2.0). Groups chain together, so too high a value merges different people.
cluster_threshold = 0.6

# `find`: a face counts as the reference person when its distance to the reference is
# strictly < this value (0.0 - 2.0). If omitted, cluster_threshold is used.
match_threshold = 0.6
